name: Test

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        if: runner.os != 'macOS'
        run: uv sync
      - name: Install dependencies (with GPU/MLX support)
        if: runner.os == 'macOS'
        run: uv sync --extra gpu
      - name: Lint with ruff
        run: uv run ruff check scrise
      - name: Check formatting with ruff
        run: uv run ruff format --check scrise
      - name: Type check with ty
        run: uv run ty check scrise
      - name: Test with pytest
        run: uv run pytest --cov=scrise
