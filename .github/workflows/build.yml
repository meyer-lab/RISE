name: Build

on: push
concurrency: gpu

jobs:
    build:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v7
            - name: Install uv
              uses: astral-sh/setup-uv@v8
            - name: Setup environment
              run: make .venv
            - name: Build figures
              run: make all -j 2
            - name: Upload files
              uses: actions/upload-artifact@v4
              with:
                  name: files
                  path: |
                      output/*.svg
