[project]
name = "scrise"
version = "1.6.0"
description = "Single cell analysis across conditions using PARAFAC2."
authors = [{name = "Andrew Ramirez"}, {name = "Aaron Meyer", email = "git@asmlab.org" }]
license = "MIT"
requires-python = ">= 3.13"

dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "scikit-learn>=1.9",
    "pandas>=3.0.0",
    "pyarrow>=25.0",
    "tensorly>=0.9.0",
    "parafac2>=1.9.0",
    "anndata>=0.13",
    "pacmap>=0.9",
    "tqdm>=4.70",
    "vsparse>=0.4.0",
    "hdf5plugin>=7.1",
    "matplotlib>=3.11",
    "seaborn>=0.13.2",
    "tlviz>=0.1.1",
]

readme = "README.md"

[project.optional-dependencies]
gpu = [
    "parafac2[gpu]",
]


[project.scripts]
fbuild = "analysis.figures.common:genFigure"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["scrise"]
module-root = ""


[dependency-groups]
analysis = [
    "seaborn>=0.13.2",
    "datashader>=0.19",
    "scanpy>=1.12",
    "tlviz>=0.1.1",
    "doubletdetection>=4.3",
    "statsmodels>=0.15",
    "hdf5plugin>=7.1",
]
benchmarking = [
    "scanorama>=1.7.4",
    "harmonypy>=2.0",
    "scib>=1.1.5",
]
docs = [
    { include-group = "analysis" },
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
]
dev = [
    { include-group = "analysis" },
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.168",
    "ty>=0.0.83",
    "ruff>=0.16",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::anndata.OldFormatWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning:seaborn",
]

[tool.coverage.report]
fail_under = 85
omit = ["scrise/tests/*"]
