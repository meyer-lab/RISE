[project]
name = "RISE"
version = "1.1.0"
description = "Single cell analysis across conditions using PARAFAC2."
authors = [{name = "Andrew Ramirez"}, {name = "Aaron Meyer", email = "git@asmlab.org" }]
license = "MIT"
requires-python = ">= 3.13"

dependencies = [
    "numpy>=2.2",
    "scipy>=1.16",
    "scikit-learn>=1.6",
    "pandas>=2.2.1",
    "tensorly>=0.8.1",
    "parafac2 @ git+https://github.com/meyer-lab/parafac2.git@v1.2.0",
    "anndata>=0.10.3",
    "pacmap>=0.7.1",
    "tqdm>=4.66.1",
    "hdf5plugin>=6.0.0",
]

readme = "README.md"

[project.scripts]
fbuild = "analysis.figures.common:genFigure"
factor = "analysis.imports:factorSave"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
analysis = [
    "seaborn>=0.13.2",
    "h5netcdf>=1.3",
    "datashader>=0.16",
    "gseapy>=1.1",
    "scanpy>=1.11",
    "tlviz>=0.1.1",
    "doubletdetection>=4.3",
    "statsmodels>=0.14.1",
    "dask[dataframe]>=2024.3.1",
    "ortools>=9.12.4544",
    "fmt>=0.3.1",
    "scanorama>=1.7.4",
    "harmonypy>=0.0.10",
    "scib>=1.1.5",
]
docs = [
    { include-group = "analysis" },
    "sphinx>=9.0",
    "sphinx-rtd-theme>=3.0.0",
    "nbsphinx>=0.9",
]
dev = [
    { include-group = "analysis" },
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ty",
    "ruff>=0.14.7",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["RISE", "analysis"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Unused arguments
    "ARG",
]
